<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minuteur</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B57D0">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Minuteur</h1>
  <p id="temps" role="timer">05:00</p>
  <div class="piste"><div id="barre"></div></div>
  <div class="presets">
    <button data-s="60">1 min</button><button data-s="300">5 min</button>
    <button data-s="600">10 min</button><button data-s="1500">25 min</button>
  </div>
  <form id="reglage">
    <label>Minutes<input id="min" type="number" min="0" max="999" value="5"></label>
    <label>Secondes<input id="sec" type="number" min="0" max="59" value="0"></label>
    <button>Régler</button>
  </form>
  <div class="actions"><button id="go">Démarrer</button><button id="raz" class="sec">Remettre à zéro</button></div>
</main>
<script src="app.js"></script>
</body>
</html>
